# permissions for end users to view quakeservertemplates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: quakeservertemplate-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: operator
    app.kubernetes.io/part-of: operator
    app.kubernetes.io/managed-by: kustomize
  name: quakeservertemplate-viewer-role
rules:
- apiGroups:
  - quakekube.io
  resources:
  - quakeservertemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quakekube.io
  resources:
  - quakeservertemplates/status
  verbs:
  - get
