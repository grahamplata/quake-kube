version: "2"

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused

issues:
  exclude-rules:
    - path: "internal/.*"
      linters:
        - dupl
