---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: quakeservertemplates.quakekube.io
spec:
  group: quakekube.io
  names:
    kind: QuakeServerTemplate
    listKind: QuakeServerTemplateList
    plural: quakeservertemplates
    singular: quakeservertemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Default game type
      jsonPath: .spec.serverConfig.game.type
      name: Game Type
      type: string
    - description: Default max clients
      jsonPath: .spec.serverConfig.server.maxClients
      name: Max Clients
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          QuakeServerTemplate is the Schema for the quakeservertemplates API
          It provides reusable server configurations that can be referenced by QuakeServer resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              QuakeServerTemplateSpec defines the desired state of QuakeServerTemplate
              Templates provide reusable server configurations that can be referenced by QuakeServer resources.
            properties:
              serverConfig:
                description: |-
                  ServerConfig contains the template server configuration.
                  These values serve as defaults and can be overridden by QuakeServer resources.
                properties:
                  bot:
                    description: Bot contains bot configuration.
                    properties:
                      minPlayers:
                        description: MinPlayers is the minimum number of players (bots
                          fill remaining slots).
                        minimum: 0
                        type: integer
                      noChat:
                        description: NoChat disables bot chat.
                        type: boolean
                      skill:
                        default: 3
                        description: Skill is the bot skill level (1-5).
                        maximum: 5
                        minimum: 1
                        type: integer
                    type: object
                  commands:
                    description: Commands are extra commands to run on the server.
                    items:
                      type: string
                    type: array
                  fragLimit:
                    default: 25
                    description: FragLimit is the number of frags required to win.
                    minimum: 0
                    type: integer
                  game:
                    description: Game contains game-specific configuration.
                    properties:
                      forceRespawn:
                        description: ForceRespawn enables forced respawn.
                        type: boolean
                      inactivity:
                        description: Inactivity is the inactivity timeout (e.g., "10m").
                        type: string
                      motd:
                        description: MOTD is the message of the day shown to players.
                        type: string
                      password:
                        description: Password is the server password for players joining.
                        type: string
                      quadFactor:
                        default: 3
                        description: QuadFactor is the damage multiplier for quad
                          damage.
                        minimum: 1
                        type: integer
                      type:
                        default: FreeForAll
                        description: Type is the game type (FreeForAll, Tournament,
                          SinglePlayer, TeamDeathmatch, CaptureTheFlag).
                        enum:
                        - FreeForAll
                        - Tournament
                        - SinglePlayer
                        - TeamDeathmatch
                        - CaptureTheFlag
                        type: string
                      weaponRespawn:
                        description: WeaponRespawn is the weapon respawn time in seconds.
                        type: integer
                    type: object
                  maps:
                    description: Maps is the list of maps to play.
                    items:
                      description: MapSpec defines a map in the rotation
                      properties:
                        captureLimit:
                          description: CaptureLimit is the capture limit for CTF maps.
                          type: integer
                        fragLimit:
                          description: FragLimit overrides the global frag limit for
                            this map.
                          type: integer
                        name:
                          description: Name is the map name (e.g., "q3dm7").
                          type: string
                        timeLimit:
                          description: TimeLimit overrides the global time limit for
                            this map.
                          type: string
                        type:
                          description: Type is the game type for this specific map.
                          enum:
                          - FreeForAll
                          - Tournament
                          - SinglePlayer
                          - TeamDeathmatch
                          - CaptureTheFlag
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  server:
                    description: Server contains server-specific configuration.
                    properties:
                      hostname:
                        description: Hostname is the server hostname displayed to
                          players.
                        type: string
                      maxClients:
                        default: 12
                        description: MaxClients is the maximum number of clients.
                        maximum: 64
                        minimum: 1
                        type: integer
                      rconPassword:
                        description: RconPassword is the RCON password for remote
                          administration.
                        type: string
                    type: object
                  timeLimit:
                    description: TimeLimit is the duration of time before the game
                      ends (e.g., "15m").
                    type: string
                type: object
            type: object
          status:
            description: QuakeServerTemplateStatus defines the observed state of QuakeServerTemplate
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the template's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              usedBy:
                description: UsedBy lists the QuakeServer resources currently using
                  this template.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
