# KIND cluster configuration for local operator testing
# Usage: kind create cluster --config hack/kind-config.yaml --name quake-operator
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP for game client WebSocket connections
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # UDP for native Quake clients
      - containerPort: 30960
        hostPort: 27960
        protocol: UDP
      # Gateway API HTTP (Envoy)
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
