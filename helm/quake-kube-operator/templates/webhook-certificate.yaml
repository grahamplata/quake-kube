{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
{{- if .Values.webhook.certManager.selfSigned }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "quake-kube-operator.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quake-kube-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "quake-kube-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quake-kube-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ include "quake-kube-operator.webhookCertSecretName" . }}
  dnsNames:
  - {{ include "quake-kube-operator.webhookServiceName" . }}.{{ .Release.Namespace }}.svc
  - {{ include "quake-kube-operator.webhookServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- if .Values.webhook.certManager.selfSigned }}
    kind: Issuer
    name: {{ include "quake-kube-operator.fullname" . }}-selfsigned
    {{- else }}
    kind: ClusterIssuer
    name: letsencrypt-prod
    {{- end }}
{{- end }}
